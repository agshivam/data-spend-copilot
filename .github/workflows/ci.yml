name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Generate synthetic spend data
        run: python scripts/generate_data.py

      - name: dbt build (models + data tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Validate semantic layer against the warehouse
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: mf validate-configs

      - name: Sample metric query
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: mf query --metrics total_spend,ai_spend,ai_share_of_spend --group-by metric_time__quarter

      - name: MCP server end-to-end tests
        run: pytest -q tests
